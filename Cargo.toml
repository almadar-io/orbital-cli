[package]
name = "orbital-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for Orbital compiler and tools"

[lib]
doctest = false

[[bin]]
name = "orbital"
path = "src/bin/orbital.rs"

[[bin]]
name = "orb"
path = "src/bin/orb.rs"

[dependencies]
# Core crates
orbital-core = { path = "../orbital-core", features = ["client-http", "native-transport"] }
orbital-compiler = { path = "../orbital-compiler" }
orbital-lolo = { path = "../orbital-lolo" }
orbital-server = { path = "../orbital-server" }
orbital-verify = { path = "../orbital-verify" }
# The sandbox manifest `orb emit manifest` builds and signs.
io-gate = { path = "../io-gate" }

# CLI essentials only
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

# Source Map v3 emission for `orb emit --map` and `orb trace`
sourcemap = "9"
# Wire-shape fixture pass (`verify_server::run_fixture_pass`).
ureq = { workspace = true, features = ["tls"] }
semver = "1"
# Embedding-text hashes (`behaviors texts`).
sha2 = "0.10"

[dev-dependencies]
orbital-test-support = { path = "../orbital-test-support" }
pretty_assertions.workspace = true
syn = { version = "2", features = ["full"] }
tempfile = "3.10"
