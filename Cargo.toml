[package]
name = "orbital-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for Orbital compiler and tools"

[lib]
doctest = false

[[bin]]
name = "orbital"
path = "src/bin/orbital.rs"

[[bin]]
name = "orb"
path = "src/bin/orb.rs"

[dependencies]
# Core crates
orbital-core = { path = "../orbital-core", features = ["client-http"] }
orbital-compiler = { path = "../orbital-compiler" }
orbital-lolo = { path = "../orbital-lolo" }
orbital-shell-rust = { path = "../orbital-shell-rust" }
thiserror = { workspace = true }
base64 = "0.22"

# CLI essentials only
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# `orb run` stops on SIGINT/SIGTERM.
tokio.workspace = true
# Logging flags, live phase spinners and timing outputs (`utils/terminal.rs`).
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-indicatif = "0.3.13"
indicatif = "0.18.0"

# Source Map v3 emission for `orb emit --map` and `orb trace`
sourcemap = "9"
# Wire-shape fixture pass (`verify_server::run_fixture_pass`).
ureq = { workspace = true, features = ["tls"] }
# Embedding-text hashes (`behaviors texts`).
sha2 = "0.10"
# Run-owned scratch directories (`commands/dev.rs`), removed when the command ends.
tempfile = "3.10"

[dev-dependencies]
orbital-test-support = { package = "orbital-integration-tests", path = "../orbital-integration-tests" }
pretty_assertions.workspace = true
syn = { version = "2", features = ["full"] }
