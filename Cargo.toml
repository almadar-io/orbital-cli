[package]
name = "orbital-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for Orbital compiler and tools"

[[bin]]
name = "orbital"
path = "src/main.rs"

[[bin]]
name = "orb"
path = "src/main.rs"

[features]
# Layer-3 screenshots: `orb verify --screenshot <dir>` renders each organism's desktop
# egui UI to a PNG via egui_kittest (offscreen wgpu).
screenshot = ["orbital-client/screenshot"]

[dependencies]
# Core crates
orbital-core = { path = "../orbital-core" }
orbital-compiler = { path = "../orbital-compiler" }
orbital-lolo = { path = "../orbital-lolo" }
orbital-shell-typescript = { path = "../orbital-shell-typescript" }
orbital-shell-python = { path = "../orbital-shell-python" }
orbital-shell-mobile = { path = "../orbital-shell-mobile" }
orbital-shell-rust = { path = "../orbital-shell-rust" }
orbital-shell-android = { path = "../orbital-shell-android" }
orbital-shell-ios = { path = "../orbital-shell-ios" }
orbital-server = { path = "../orbital-server" }
# Use desktop feature without bevy (default-features = false to skip bevy-ui)
orbital-client = { path = "../orbital-client", default-features = false, features = ["desktop", "sync-http"] }
orbital-verify = { path = "../orbital-verify" }

# CLI essentials only
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

# Source Map v3 emission for `orb emit --map` and `orb trace`
sourcemap = "9"

[dev-dependencies]
pretty_assertions.workspace = true
syn = { version = "2", features = ["full"] }
